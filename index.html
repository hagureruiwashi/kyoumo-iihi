    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================
           ローディング画面
        ========================= */

        #loading {
            position: fixed;
            inset: 0;
            background: #6FB7E9;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;

            /* 3秒後に消える */
            animation: loading-fadeout 0.5s ease forwards;
            animation-delay: 2.5s;
        }

        /* いわしちゃん */
        #loading img {
            width: 220px;
            animation: boat-yura 1.5s ease-in-out infinite;
        }

        /* ゆらゆら揺れる */
        @keyframes boat-yura {
            0%, 100% {
                transform: rotate(-3deg) translateY(0);
            }

            50% {
                transform: rotate(3deg) translateY(-8px);
            }
        }

        /* 最後に少し遠ざかって消える */
        @keyframes loading-fadeout {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.08);
                pointer-events: none;
            }
        }
    </style>
</head>
