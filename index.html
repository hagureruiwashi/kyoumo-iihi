<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. 魚のボタンと、メニューの中身をプログラムに見つけさせる
  const trigger = document.querySelector('.accordion-trigger');
  const content = document.querySelector('.accordion-content');

  // もしどちらかが見つからない場合はエラーを防ぐ
  if (!trigger || !content) return;

  // 最初はメニューを完全に非表示（安全策）にしておく
  content.style.display = 'none';

  // 2. 魚のボタンがクリックされたときの動き
  trigger.addEventListener('click', () => {
    // 魚の見た目を変えるためのクラスを切り替える
    trigger.classList.toggle('is-open');

    // 3. 今メニューが閉じているなら開き、開いているなら閉じる（強制切り替え）
    if (content.style.display === 'none') {
      content.style.display = 'block';    // 強制表示
      content.style.height = 'auto';      // 高さを自動で広げる
    } else {
      content.style.display = 'none';     // 強制非表示
      content.style.height = '0';
    }
  });
});
</script>
