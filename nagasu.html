<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>ビンを流す</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="form-area">

    <img src="img/bottle.png" class="form-bottle" alt="瓶">

    <form id="ogiri-form">

      <h2>大喜利をビンに詰める</h2>

      <label>
        大喜利のお題
        <textarea id="question-input" required></textarea>
      </label>

      <label>
        ひとこと
        <textarea id="message-input"></textarea>
      </label>

      <label>
        なまえ
        <input type="text" id="name-input" required>
      </label>

      <button type="submit">ビンにつめる</button>

    </form>

  </div>


  <a href="#" class="floating-fish-btn">
    <span class="fish-icon">🐟</span>
    <span class="fish-text">もどる</span>
  </a>


  <script src="script.js"></script>

</body>

</html>
