<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>水中展覧会</title>
  <link rel="stylesheet" href="style.css">
</head>
 <!-- 作品が流れる場所553 -->
<div class="exhibition">

  <!-- 作品が流れる場所 -->
  <div class="art-flow">

    <div class="art-item">
      <img src="img/art01.jpg" alt="作品1">
    </div>

    <div class="art-item">
      <img src="img/art02.jpg" alt="作品2">
    </div>

    <div class="art-item">
      <img src="img/art03.jpg" alt="作品3">
    </div>

    <div class="art-item">
      <img src="img/comic01.jpg" alt="四コマ">
    </div>

  </div>


  <!-- 作品を大きく見る画面 -->
  <div class="art-viewer">

    <img id="big-art" src="" alt="">

    <div id="art-title"></div>

    <button id="next-art">
      つぎの作品へ
    </button>

  </div>

</div>
