<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>大喜利IN A BOTTLE</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ogiri">

        <!-- 海 -->
        <div class="sea"></div>

        <!-- 砂浜 -->
        <div class="beach"></div>

        <!-- いわしちゃん -->
        <div id="iwashi">👧🐟</div>

        <!-- 瓶 -->
        <div id="bottle">🫙</div>

        <!-- 紙 -->
        <div id="paper">📜</div>

        <!-- お題 -->
        <div id="question"></div>

        <!-- 回答 -->
        <div id="answer"></div>

        <!-- 操作 -->
        <div id="message">瓶をタップしてみて</div>
        <!-- 波 -->
        <div id="wave">🌊</div>

    </div>
    <script src="script.js"></script>
</body>
</html>
